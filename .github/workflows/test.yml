name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: go test ./... -cover -coverprofile=coverage.out

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "percentage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COVERAGE}%"

      - name: Build coverage badge payload
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          COVERAGE="${{ steps.coverage.outputs.percentage }}"
          COLOR="red"
          if awk "BEGIN { exit !(${COVERAGE} >= 80) }"; then
            COLOR="brightgreen"
          elif awk "BEGIN { exit !(${COVERAGE} >= 60) }"; then
            COLOR="yellow"
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$COVERAGE" "$COLOR" > coverage.json

      - name: Update coverage badge gist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          COVERAGE_GIST_ID: ${{ secrets.COVERAGE_GIST_ID }}
        with:
          github-token: ${{ secrets.GIST_SECRET }}
          script: |
            const fs = require('node:fs');
            const content = fs.readFileSync('coverage.json', 'utf8');

            await github.request('PATCH /gists/{gist_id}', {
              gist_id: process.env.COVERAGE_GIST_ID,
              files: {
                'coverage.json': {
                  content,
                },
              },
            });
