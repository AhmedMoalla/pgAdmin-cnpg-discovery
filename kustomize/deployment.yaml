apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      serviceAccountName: pgadmin-cnpg-discovery
      securityContext:
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:8.4
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - secretRef:
                name: pgadmin-credentials
          env:
            - name: PGADMIN_SERVER_JSON_FILE
              value: /shared/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            - name: PGPASS_FILE
              value: /shared/.pgpass
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        - name: cnpg-discovery
          image: docker.io/ahmedmoalla/pgadmin-cnpg-discovery:latest
          imagePullPolicy: Always
          env:
            - name: SERVERS_JSON_PATH
              value: /shared/servers.json
            - name: PGPASS_PATH
              value: /shared/.pgpass
            - name: POLL_INTERVAL
              value: "30s"
            - name: LOG_LEVEL
              value: info
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 5050
            runAsGroup: 5050
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: shared
          emptyDir: {}
        - name: pgadmin-data
          emptyDir: {}
